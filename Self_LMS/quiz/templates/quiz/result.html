<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result</title>
    <style>
        body { 
            font-family: system-ui; 
            display:flex; align-items:center; justify-content:center; 
            min-height:100vh; background:#f8fafc; margin:0; 
        }
        .result-card {
            background:white; padding:3rem; border-radius:20px; 
            box-shadow:0 10px 15px -3px rgb(0 0 0 / 0.1);
            max-width:500px; text-align:center;
        }
        .correct { color:#22c55e; font-size:4rem; }
        .incorrect { color:#ef4444; font-size:4rem; }
        button { 
            margin-top:2rem; padding:14px 32px; font-size:1.1rem; 
            border:none; border-radius:9999px; cursor:pointer; 
            background:#6366f1; color:white;
        }
    </style>
</head>
<body>
    <div class="result-card">
        {% if is_correct %}
            <div class="correct">🎉 Correct!</div>
        {% else %}
            <div class="incorrect">😔 Incorrect</div>
        {% endif %}
        
        <h2 style="margin:1.5rem 0 1rem;">{{ question.text }}</h2>
        <p><strong>Your answer:</strong> {{ user_answer|yesno:"True,False" }}</p>
        <p><strong>Correct answer:</strong> {{ correct_answer|yesno:"True,False" }}</p>
        
        {% if is_preview %}
    <a href="{% url 'quiz_preview' %}">
        <button>Back to Preview</button>
    </a>
{% else %}
    <a href="{% url 'quiz_view' question_id=question.id %}">
        <button>Try Next Question</button>
    </a>
{% endif %}
            <button>Try Next Question</button>
        </a>
    </div>
</body>
</html>
